[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/codex-usage"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tokio = { version = "1", features = [
  "process",
  "io-util",
  "time",
  "sync",
  "rt",
  "macros"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
