<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <script src="dialog.js" defer></script>
  <title>纸笺</title>
</head>
<body>
  <article class="paper">
    <header><span id="title">来自桌面的一句话</span><button id="close" aria-label="关闭当前内容">×</button></header>
    <main><p id="text"></p><img id="image" alt="展示图片" hidden><div id="usage"></div><p id="credit"></p></main>
    <footer><span id="status"></span><button id="refresh">换一句</button></footer>
  </article>
</body>
</html>
